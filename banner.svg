<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgEcl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020102" />
      <stop offset="100%" stop-color="#0a0303" />
    </linearGradient>
    <radialGradient id="coronaOut" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="#991b1b" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="coronaIn" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#ef4444" stop-opacity="1" />
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0" />
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="320" rx="18" /></clipPath>
  </defs>
  
  <style>
    .t-ecl { font-family: 'Consolas', monospace; font-weight: 800; font-size: 52px; letter-spacing: 4px; fill: #ffffff; text-shadow: 0px 0px 12px #ef4444, 0px 0px 4px #fff; }
    .sub-ecl { font-family: 'Consolas', monospace; font-size: 14px; letter-spacing: 8px; fill: #d1d5db; }
    .hud { font-family: 'Courier New', monospace; font-size: 13px; fill: #7f1d1d; letter-spacing: 2px; }
    
    /* Animations */
    .spin-slow { transform-origin: 600px 160px; animation: spin 40s linear infinite; }
    .spin-fast { transform-origin: 600px 160px; animation: spin 15s linear infinite reverse; }
    .pulse { animation: throb 4s ease-in-out infinite alternate; }
    .float { animation: drift 12s linear infinite; }
    .glitch-hud { animation: flicker 6s infinite; }
    
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes throb { 
      0% { transform: scale(0.95); opacity: 0.8; } 
      100% { transform: scale(1.05); opacity: 1; } 
    }
    @keyframes drift { 
      0% { transform: translateY(20px) translateX(0); opacity: 0; } 
      20% { opacity: 0.8; } 
      80% { opacity: 0.8; } 
      100% { transform: translateY(-160px) translateX(40px); opacity: 0; } 
    }
    @keyframes flicker { 
      0%, 94%, 98%, 100% { opacity: 1; } 
      95%, 99% { opacity: 0.2; } 
    }
  </style>
  
  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bgEcl)" />

    <!-- Background Constellations / Data Nodes (Fill empty sides) -->
    <g stroke="#3f0f0f" stroke-width="1" opacity="0.6">
        <!-- Kiri -->
        <line x1="120" y1="120" x2="280" y2="160" />
        <line x1="280" y1="160" x2="190" y2="240" />
        <circle cx="120" cy="120" r="3" fill="#7f1d1d" />
        <circle cx="280" cy="160" r="3" fill="#7f1d1d" />
        <circle cx="190" cy="240" r="3" fill="#7f1d1d" />
        <!-- Kanan -->
        <line x1="920" y1="160" x2="1080" y2="100" />
        <line x1="920" y1="160" x2="1010" y2="240" />
        <circle cx="920" cy="160" r="3" fill="#7f1d1d" />
        <circle cx="1080" cy="100" r="3" fill="#7f1d1d" />
        <circle cx="1010" cy="240" r="3" fill="#7f1d1d" />
    </g>
    
    <!-- Floating Embers / Partikel Api -->
    <g fill="#ef4444">
        <!-- Kiri -->
        <circle cx="150" cy="280" r="2.5" class="float" style="animation-duration: 12s; animation-delay: 0s;" />
        <circle cx="280" cy="300" r="1.5" class="float" style="animation-duration: 9s; animation-delay: 2s;" />
        <circle cx="80" cy="220" r="2" class="float" style="animation-duration: 15s; animation-delay: 5s;" />
        <circle cx="220" cy="320" r="1" class="float" style="animation-duration: 10s; animation-delay: 1s;" />
        <!-- Kanan -->
        <circle cx="900" cy="280" r="2" class="float" style="animation-duration: 11s; animation-delay: 3s;" />
        <circle cx="1050" cy="310" r="1.5" class="float" style="animation-duration: 10s; animation-delay: 1.5s;" />
        <circle cx="1120" cy="200" r="2.5" class="float" style="animation-duration: 14s; animation-delay: 6s;" />
        <circle cx="980" cy="320" r="1.2" class="float" style="animation-duration: 13s; animation-delay: 0.5s;" />
    </g>

    <!-- Eclipse Corona Base -->
    <circle cx="600" cy="160" r="340" fill="url(#coronaOut)" class="pulse" />
    
    <!-- Occult Geometric Rings (Berputar Lambat) -->
    <g class="spin-slow" opacity="0.3" stroke="#ef4444" fill="none">
        <circle cx="600" cy="160" r="210" stroke-width="1.5" stroke-dasharray="2 12" />
        <circle cx="600" cy="160" r="240" stroke-width="1" stroke-dasharray="40 20 10 20" />
        <!-- Segitiga Terbalik ala sekte -->
        <polygon points="600, -80 808, 280 392, 280" stroke-width="1.5" opacity="0.4" /> 
    </g>

    <!-- Chaotic Solar Flares (Berputar Cepat Kebalikannya) -->
    <g class="spin-fast" fill="#ef4444" opacity="0.7">
      <path d="M 600,-20 L 610,130 L 590,130 Z" />
      <path d="M 600,340 L 610,190 L 590,190 Z" />
      <path d="M 420,160 L 570,150 L 570,170 Z" />
      <path d="M 780,160 L 630,150 L 630,170 Z" />
      <!-- Flare Diagonal Tipis -->
      <path d="M 470,30 L 580,140 L 560,150 Z" opacity="0.6" />
      <path d="M 730,290 L 620,180 L 640,170 Z" opacity="0.6" />
    </g>

    <!-- Inner Eclipse Core -->
    <circle cx="600" cy="160" r="150" fill="url(#coronaIn)" />
    
    <!-- The Void (Lubang Hitam Tengah) -->
    <circle cx="600" cy="160" r="140" fill="#020102" />

    <!-- Teks Utama di Dalam Void -->
    <text class="t-ecl" x="600" y="155" text-anchor="middle">Eligos</text>
    <text class="sub-ecl" x="600" y="210" text-anchor="middle">Lalu <tspan fill="#ef4444">✦</tspan> M. <tspan fill="#ef4444">✦</tspan> Sulthan <tspan fill="#ef4444">✦</tspan> Azmy</text>
    
    <!-- Cyber HUD Elements (Sudut-sudut) -->
    <g class="glitch-hud">
        <text class="hud" x="40" y="45">[SYS.CORE_CORRUPTED]</text>
        <text class="hud" x="40" y="60">MEM: 0xDEADBEEF</text>
        
        <text class="hud" x="1160" y="45" text-anchor="end">PRTCL: ECLIPSE_99</text>
        <text class="hud" x="1160" y="60" text-anchor="end">STATUS: UNKNOWN</text>
        
        <text class="hud" x="40" y="270">NODE: OFFLINE</text>
        <text class="hud" x="40" y="285">>_ AWAITING_VOID</text>
        
        <text class="hud" x="1160" y="270" text-anchor="end">LOC: SECTOR_7</text>
        <text class="hud" x="1160" y="285" text-anchor="end">ARCHITECT // ONLINE</text>
    </g>
    
    <!-- Corner Brackets Pembingkai Banner -->
    <path d="M 25 65 L 25 25 L 65 25 M 1135 25 L 1175 25 L 1175 65 M 25 255 L 25 295 L 65 295 M 1135 295 L 1175 295 L 1175 255" fill="none" stroke="#7f1d1d" stroke-width="2" opacity="0.6" />

  </g>
  
  <!-- Outer Stroke -->
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#ef4444" stroke-opacity="0.3" stroke-width="2" />
</svg>
